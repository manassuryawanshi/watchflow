<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Outer Focus Ring -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="14 6" />
  
  <!-- Intentional Target Reticle Dots -->
  <circle cx="64" cy="20" r="3" fill="#60a5fa" />
  <circle cx="64" cy="108" r="3" fill="#60a5fa" />
  <circle cx="20" cy="64" r="3" fill="#60a5fa" />
  <circle cx="108" cy="64" r="3" fill="#60a5fa" />
  
  <!-- Inner Play Target -->
  <polygon points="56,46 56,82 82,64" fill="url(#playGrad)" rx="3" />
</svg>
